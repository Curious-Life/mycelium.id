name: verify

# Runs the full verify suite (300 GO-gated gates) on every PR to main and on
# pushes to the working branch. This is the automated green/red signal for
# reviewers and the gate the autonomous routine wakes on. Tier-1 only — the
# suite passes without the ML stack (real embeddings/clustering are Tier-2 and
# verified on a host where onnxruntime/Ollama are installed).
#
# `npm run verify` is THE gate — it is the only chain this workflow runs, so a
# gate that is not in it gates nothing. `verify:chains` runs FIRST inside it and
# fails the build if any registered verify:* gate has drifted out of the chain
# (that drift went unnoticed for months — see the verify-chain divergence writeup).
# Do NOT add a gate here as a separate step; add it to `verify`.

on:
  workflow_dispatch:   # manual trigger (Actions UI / `gh workflow run verify.yml --ref <branch>`)
  pull_request:
    branches: [main, 'feat/**', 'claude/**']   # PRs into main, feature branches, or the loop's branches
  push:
    branches:
      - main
      - 'feat/**'                # active working branches
      - 'claude/auto-loop/**'    # the autonomous build loop's own per-unit branches

# Least-privilege default: this workflow only reads the checked-out code (it
# runs the verify suite; it never writes to the repo, comments, or touches
# releases). An explicit top-level block replaces GITHUB_TOKEN's broad default
# and satisfies the actions/missing-workflow-permissions hardening check.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 45, not 15. Wiring the 60 previously-unrun gates took the suite from 239 to 300
    # gates, but the real driver is RUNNER VARIANCE, measured on two runs of this very
    # PR with an identical chain:
    #   run A: 300 gates in 11.5 min  (verify:at-rest-migration 19.0s)
    #   run B: 209 gates in 23.7 min  (verify:at-rest-migration 91.7s) -> killed at 25m
    # Same commit range, ~3x apart: no gate hung, run B's runner was simply that much
    # slower. Extrapolated, run B needed ~34 min for the full chain. 25 was set from
    # run A's numbers and would flap on every slow runner — a red build that means
    # nothing, which is its own kind of ungated.
    # 45 keeps a real ceiling (a true hang is unbounded and still trips it) with ~25%
    # headroom over the slow-runner case. The durable fix is to shard this job across
    # a matrix rather than keep raising the number; that needs the chain to be
    # splittable without breaking verify:chains' single-chain contract — out of scope
    # here, worth doing if the suite grows much past 300.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The measurement-layer verify gates (fisher, harmonics, criticality,
      # coherence, behavioral, anchors, cross-scale-coupling, the *-encryption
      # gates, …) spawn pipeline/.venv/bin/python3. They are still Tier-1 — they
      # exercise the AES-GCM crypto + the metric math, NOT the ML clustering
      # stack. Required deps: numpy/scipy/cryptography (core), python-dotenv
      # (cluster.py top-level import, reached by the nomic-embedding gate), and
      # ripser/persim/PyWavelets (the harmonics + §4.24 cross-scale gates seed
      # enough data to actually exercise the persistence-entropy / Haar-wavelet
      # paths, so the otherwise-lazy imports DO execute). NOT needed and
      # deliberately excluded (Tier-2, heavy native wheels, lazy in cluster.py):
      # faiss-cpu / python-igraph / leidenalg / umap-learn / onnxruntime /
      # tokenizers / huggingface-hub. Python 3.12 matches the host-verify env.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision pipeline venv (Tier-1 crypto + metrics deps only)
        run: |
          python3 -m venv pipeline/.venv
          pipeline/.venv/bin/python3 -m pip install --upgrade pip
          pipeline/.venv/bin/python3 -m pip install \
            'numpy>=1.26,<3' 'scipy>=1.11' 'cryptography>=48.0.1,<49' \
            'python-dotenv>=1.0' 'ripser>=0.6' 'persim>=0.3' 'PyWavelets>=1.6'

      # Install + BUILD the SvelteKit portal BEFORE the verify suite. verify:app-csp
      # asserts the hardened CSP on the REAL shipped shell (canonical build); without
      # portal-app/build/200.html it falls back to the legacy single-file portal,
      # which has no SPA-fallback route, so the canonical SPA-fallback CSP path goes
      # unverified. Building here makes the gate exercise the actual shipped path.
      - name: Install portal-app dependencies
        run: npm --prefix portal-app ci

      - name: Build portal-app (canonical shell for verify:app-csp)
        run: npm --prefix portal-app run build

      - name: Run verify suite
        run: npm run verify

      # Type-check the SvelteKit portal (svelte-check). Not part of `npm run
      # verify` (that's the backend suite) and previously ungated — which let
      # frontend type errors accumulate. svelte-check exits non-zero on errors
      # only (a11y warnings don't fail the gate).
      - name: Type-check portal-app
        run: npm run portal:check

  # Supply-chain gate: the Python equivalent of `npm audit`. Audits the committed
  # hash-lock (pipeline/requirements.lock.txt — the exact wheels the .app bundles)
  # against the PyPI advisory DB and FAILS on any known CVE, so a future advisory
  # against a pinned dep surfaces on the next PR/push instead of shipping silently.
  # --require-hashes also rejects a lock whose hashes don't resolve. Independent of
  # the verify job so a dep-CVE gives a distinct red signal.
  # See the Python-deps supply-chain notes (Finding 3).
  audit:
    name: pip-audit (pipeline supply-chain)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit the hash-locked pipeline deps
        run: |
          python3 -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --quiet --upgrade pip pip-audit
          # ── cryptography 48.0.1 — three CVEs published 2026-08-04, IGNORED with cause (D-137) ──
          # All three live in code paths this pipeline NEVER invokes (crypto_local.py imports
          # ONLY hazmat AESGCM / HKDF / hashes / aes_key_wrap — grep it):
          #   CVE-2026-69247  PKCS#7 EnvelopedData decryption Bleichenbacher oracle (fix: 50.0.0)
          #   CVE-2026-69248  X.509 verifier wildcard-DNS permittedSubtrees escape  (fix: 49.0.0)
          #   CVE-2026-69249  X.509 duplicate self-signed intermediates path blowup (fix: 49.0.0)
          # No PKCS#7 use, no certificate verification anywhere under pipeline/. The REAL
          # remediation is a decision, not a bump: requirements.txt caps <49 because 49.x
          # dropped Intel/universal2 wheels — clearing all three needs >=50, which forces a
          # Rust source build for the x86_64 bundle (or retiring it) + regenerating the hash
          # lock. Tracked as D-137 in the defect ledger; remove these ignores there.
          /tmp/audit-venv/bin/pip-audit -r pipeline/requirements.lock.txt --require-hashes \
            --ignore-vuln CVE-2026-69247 \
            --ignore-vuln CVE-2026-69248 \
            --ignore-vuln CVE-2026-69249

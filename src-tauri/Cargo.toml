[package]
name = "mycelium"
version = "0.1.15"
description = "Mycelium — your private cognitive vault"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api enables the transparent window the glass UI shows through.
tauri = { version = "2", features = ["macos-private-api"] }
# Read remote.json (the remote-access toggle) at startup.
serde_json = "1"
# Auto-updater (production only, signature-verified, fail-open). Checks a signed
# latest.json on the PUBLIC GitHub Release; the dialog + process plugins drive the
# native "Update & Restart" prompt + relaunch. These three plugins are driven from
# RUST ONLY and are deliberately given no webview permission in
# capabilities/default.json — the webview reaches the updater exclusively through the
# app's own check_for_update / install_update / get_available_update commands, which
# are ACL-granted one by one (D-022; see build.rs).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Open an external URL in the OS default browser (D-010). The webview loads a REMOTE
# http origin and swallows window.open('_blank'), so the browser sign-in never
# opened — this plugin's open_url hands the URL to the native side. Only the URL
# scheme allowlist (http/https/mailto/tel via opener:allow-default-urls) is granted;
# no file-path opening. See src-tauri/capabilities/default.json.
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Native NSVisualEffectView vibrancy behind the transparent webview.
window-vibrancy = "0.6"

[target.'cfg(unix)'.dependencies]
# Process-group kill — libc::kill(-pgid, …) reaps sidecars + grandchildren on exit.
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <!-- ============================================================
       Mycelium — macOS DMG installer background
       Brand: gold mushroom on a black starfield (aurum #E5B84C).
       Finder overlays the real Mycelium.app icon (left slot) and the
       Applications-folder alias (right slot) ON TOP of this art at 160pt,
       so the two icon "slots" here are intentionally left empty.
       Logical window: 560x400.  App slot centre (150,180),
       Applications slot centre (410,180).  Keep those clear.
       The drag arrow sits BETWEEN the icons, on their centre line (y180),
       centred in the gap — a clean "drag this into that" connector, with
       generous open sky below.
       ============================================================ -->
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.40" r="0.95">
      <stop offset="0" stop-color="#12141C"/>
      <stop offset="0.55" stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE38A"/>
      <stop offset="0.5" stop-color="#E6B92E"/>
      <stop offset="1" stop-color="#B07E1C"/>
    </linearGradient>
    <linearGradient id="arrowFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#E6B92E" stop-opacity="0.15"/>
      <stop offset="0.4"  stop-color="#E6B92E" stop-opacity="0.65"/>
      <stop offset="1"    stop-color="#FCE38A" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="milky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3350" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2A3350" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="softBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- deep space -->
  <rect width="560" height="400" fill="url(#sky)"/>

  <!-- faint Milky-Way band: one low sweep across the open lower sky,
       one high sweep top-right — both clear of the icon slots -->
  <g opacity="0.9">
    <ellipse cx="150" cy="336" rx="215" ry="60" fill="url(#milky)" transform="rotate(-15 150 336)"/>
    <ellipse cx="470" cy="78"  rx="165" ry="50" fill="url(#milky)" transform="rotate(-16 470 78)"/>
  </g>

  <!-- glow halos behind a few bright stars -->
  <g filter="url(#softBig)" opacity="0.5">
    <circle cx="70"  cy="310" r="8" fill="#FFE9B8"/>
    <circle cx="514" cy="104" r="7" fill="#DCE6FF"/>
    <circle cx="452" cy="320" r="6" fill="#FFFFFF"/>
    <circle cx="92"  cy="76"  r="6" fill="#DCE6FF"/>
  </g>

  <!-- starfield (hand-placed, clear of the two icon slots and the arrow band) -->
  <g fill="#FFFFFF">
    <!-- top band -->
    <circle cx="36"  cy="50"  r="1.1" opacity="0.8"/>
    <circle cx="92"  cy="76"  r="2.1" opacity="1"/>
    <circle cx="150" cy="44"  r="1.4" opacity="0.8"/>
    <circle cx="238" cy="50"  r="1.6" opacity="0.9"/>
    <circle cx="282" cy="86"  r="1.2" opacity="0.7"/>
    <circle cx="300" cy="46"  r="1.3" opacity="0.75"/>
    <circle cx="380" cy="62"  r="1.2" opacity="0.7"/>
    <circle cx="470" cy="46"  r="1.5" opacity="0.9"/>
    <circle cx="514" cy="104" r="2.2" opacity="1"/>
    <circle cx="528" cy="50"  r="1.2" opacity="0.7"/>
    <circle cx="430" cy="108" r="1.1" opacity="0.6"/>
    <!-- left column (clear of left icon at 150,180 r~85) -->
    <circle cx="44"  cy="150" r="1.2" opacity="0.7"/>
    <circle cx="40"  cy="222" r="1.4" opacity="0.85"/>
    <circle cx="70"  cy="310" r="2.2" opacity="1"/>
    <circle cx="34"  cy="286" r="1.3" opacity="0.7"/>
    <circle cx="112" cy="292" r="1.1" opacity="0.6"/>
    <!-- right column (clear of right icon at 410,180 r~85) -->
    <circle cx="512" cy="182" r="1.4" opacity="0.8"/>
    <circle cx="530" cy="236" r="1.2" opacity="0.7"/>
    <circle cx="500" cy="300" r="1.4" opacity="0.85"/>
    <circle cx="452" cy="140" r="1.0" opacity="0.6"/>
    <!-- open lower sky (below the icons + arrow) -->
    <circle cx="150" cy="356" r="1.3" opacity="0.75"/>
    <circle cx="210" cy="330" r="1.0" opacity="0.55"/>
    <circle cx="252" cy="368" r="1.4" opacity="0.8"/>
    <circle cx="300" cy="344" r="1.1" opacity="0.6"/>
    <circle cx="360" cy="366" r="1.2" opacity="0.7"/>
    <circle cx="452" cy="320" r="2.0" opacity="1"/>
    <circle cx="512" cy="356" r="1.3" opacity="0.75"/>
    <circle cx="404" cy="352" r="1.0" opacity="0.55"/>
  </g>
  <g fill="#DCE6FF">
    <circle cx="92"  cy="76"  r="1.0" opacity="0.9"/>
    <circle cx="514" cy="104" r="1.0" opacity="0.9"/>
    <circle cx="470" cy="46"  r="0.9" opacity="0.8"/>
  </g>

  <!-- No wordmark and no caption: Finder paints "Mycelium" under the app icon and
       "Applications" under the folder, so the art stays a clean starfield and the
       name isn't repeated. The drag gesture is carried by the arrow between them. -->

  <!-- ============ drag arrow BETWEEN the icons: Mycelium -> Applications ==========
       A clean, near-horizontal connector centred in the gap on the icon centre line
       (y180). Endpoints x220..x342 sit ~15px clear of each 160pt icon, so the arrow
       is well spaced between the two icons and reads unmistakably as "drag into". -->
  <!-- soft glow underlay -->
  <path d="M220,182 C262,171 300,171 342,180" fill="none" stroke="#E6B92E"
        stroke-width="8" stroke-linecap="round" opacity="0.16" filter="url(#soft)"/>
  <!-- shaft, fading in from the Mycelium side toward a bright head at Applications -->
  <path d="M220,182 C262,171 300,171 342,180" fill="none" stroke="url(#arrowFade)"
        stroke-width="3.8" stroke-linecap="round"/>
  <!-- arrowhead, pointing right into the Applications folder -->
  <path d="M342,180 L330,172 M342,180 L330,189" fill="none" stroke="#FCE38A"
        stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

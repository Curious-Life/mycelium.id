<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <!-- ============================================================
       Mycelium — macOS DMG installer background
       Brand: gold mushroom on a black starfield (aurum #E5B84C).
       Finder overlays the real Mycelium.app icon (left slot) and the
       Applications-folder alias (right slot) ON TOP of this art at 160pt,
       so the two icon "slots" here are intentionally left empty.
       Logical window: 560x380.  App slot centre (150,172),
       Applications slot centre (410,172).  Keep those clear.
       ============================================================ -->
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.34" r="0.95">
      <stop offset="0" stop-color="#12141C"/>
      <stop offset="0.55" stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE38A"/>
      <stop offset="0.5" stop-color="#E6B92E"/>
      <stop offset="1" stop-color="#B07E1C"/>
    </linearGradient>
    <linearGradient id="arrowFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#E6B92E" stop-opacity="0.12"/>
      <stop offset="0.4"  stop-color="#E6B92E" stop-opacity="0.62"/>
      <stop offset="1"    stop-color="#FCE38A" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="milky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3350" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2A3350" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="softBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- deep space -->
  <rect width="560" height="380" fill="url(#sky)"/>

  <!-- faint Milky-Way band -->
  <g opacity="0.9">
    <ellipse cx="120" cy="320" rx="200" ry="62" fill="url(#milky)" transform="rotate(-18 120 320)"/>
    <ellipse cx="470" cy="80"  rx="160" ry="50" fill="url(#milky)" transform="rotate(-18 470 80)"/>
  </g>

  <!-- glow halos behind a few bright stars -->
  <g filter="url(#softBig)" opacity="0.5">
    <circle cx="70"  cy="290" r="8" fill="#FFE9B8"/>
    <circle cx="512" cy="110" r="7" fill="#DCE6FF"/>
    <circle cx="452" cy="300" r="6" fill="#FFFFFF"/>
    <circle cx="96"  cy="82"  r="6" fill="#DCE6FF"/>
  </g>

  <!-- starfield (hand-placed, clear of the two icon slots) -->
  <g fill="#FFFFFF">
    <circle cx="36"  cy="54"  r="1.1" opacity="0.8"/>
    <circle cx="74"  cy="108" r="1.5" opacity="0.9"/>
    <circle cx="100" cy="80"  r="2.1" opacity="1"/>
    <circle cx="56"  cy="180" r="1.2" opacity="0.7"/>
    <circle cx="42"  cy="238" r="1.4" opacity="0.85"/>
    <circle cx="70"  cy="290" r="2.2" opacity="1"/>
    <circle cx="34"  cy="322" r="1.3" opacity="0.7"/>
    <circle cx="112" cy="300" r="1.1" opacity="0.6"/>
    <circle cx="150" cy="60"  r="1.4" opacity="0.8"/>
    <circle cx="252" cy="52"  r="1.6" opacity="0.9"/>
    <circle cx="286" cy="96"  r="1.2" opacity="0.7"/>
    <circle cx="300" cy="56"  r="1.3" opacity="0.75"/>
    <circle cx="262" cy="316" r="1.3" opacity="0.7"/>
    <circle cx="296" cy="292" r="1.1" opacity="0.6"/>
    <circle cx="238" cy="330" r="1.4" opacity="0.8"/>
    <circle cx="380" cy="72"  r="1.2" opacity="0.7"/>
    <circle cx="470" cy="52"  r="1.5" opacity="0.9"/>
    <circle cx="512" cy="110" r="2.2" opacity="1"/>
    <circle cx="526" cy="56"  r="1.2" opacity="0.7"/>
    <circle cx="500" cy="180" r="1.4" opacity="0.8"/>
    <circle cx="528" cy="232" r="1.2" opacity="0.7"/>
    <circle cx="474" cy="292" r="1.4" opacity="0.85"/>
    <circle cx="452" cy="300" r="2.0" opacity="1"/>
    <circle cx="520" cy="316" r="1.3" opacity="0.75"/>
    <circle cx="430" cy="118" r="1.1" opacity="0.6"/>
    <circle cx="190" cy="300" r="1.1" opacity="0.6"/>
    <circle cx="130" cy="140" r="1.0" opacity="0.55"/>
  </g>
  <g fill="#DCE6FF">
    <circle cx="100" cy="80"  r="1.0" opacity="0.9"/>
    <circle cx="512" cy="110" r="1.0" opacity="0.9"/>
    <circle cx="470" cy="52"  r="0.9" opacity="0.8"/>
  </g>

  <!-- No wordmark and no caption: Finder paints "Mycelium" under the app icon and
       "Applications" under the folder, so the art stays a clean starfield and the
       name isn't repeated. The drag gesture is carried entirely by the arrow below. -->

  <!-- ============ curved drag arrow along the bottom: Mycelium -> Applications ====
       A graceful arc that sweeps out from beneath the Mycelium icon, dips low across
       the empty middle, and rises with an arrowhead up toward the Applications folder
       — reading unmistakably as "drag this into that". -->
  <!-- soft glow underlay -->
  <path d="M162,300 C232,352 330,352 396,300" fill="none" stroke="#E6B92E"
        stroke-width="8" stroke-linecap="round" opacity="0.15" filter="url(#soft)"/>
  <!-- shaft, fading in from the Mycelium side toward a bright head at Applications -->
  <path d="M162,300 C232,352 330,352 396,300" fill="none" stroke="url(#arrowFade)"
        stroke-width="3.6" stroke-linecap="round"/>
  <!-- arrowhead, pointing up-right into the Applications folder -->
  <path d="M396,300 L381,296 M396,300 L390,314" fill="none" stroke="#FCE38A"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
